 name: RaceDay SQL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SQL files
        run: |
          echo "Checking RaceDay SQL files..."
          find . -maxdepth 1 -name "*.sql" -print
          echo "SQL files found successfully."

      - name: CI validation complete
        run: echo "RaceDay CI validation completed successfully."
